name: Bug Report
description: Report something that doesn't work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill in the
        fields below so we can reproduce and fix it quickly.

  - type: dropdown
    id: mod
    attributes:
      label: Mod
      description: Which mod is affected? (If "Other", name it in the title.)
      options:
        - SmoothContainer
        - Other (specify in title)
    validations:
      required: true

  - type: dropdown
    id: mc-version
    attributes:
      label: Minecraft Version
      options:
        - 1.20.1
        - 1.21.1
        - 1.21.11
        - 26.1.2
        - Other (specify below)
    validations:
      required: true

  - type: dropdown
    id: loader
    attributes:
      label: Loader
      options:
        - Fabric
        - Forge
        - NeoForge
        - Other (specify below)
    validations:
      required: true

  - type: input
    id: mod-version
    attributes:
      label: Mod Version
      placeholder: "e.g. 1.0.0"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction Steps
      description: Step-by-step instructions to trigger the bug.
      placeholder: |
        1. Launch the game with the mod installed
        2. Open a chest
        3. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Paste relevant log output here. If you're reporting from the
        AssetDesign app, include any lines starting with `[MODAPP-ERROR]`.
      render: shell
    validations:
      required: false
