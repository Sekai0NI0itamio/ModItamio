name: Build Create TNT versions

on:
  push:
    paths:
      - '.github/workflows/createtnt-build.yml'
      - 'mods/createtnt/**'
  pull_request:
    paths:
      - '.github/workflows/createtnt-build.yml'
      - 'mods/createtnt/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: mods/createtnt/1.8.9-forge
            java: '8'
            gradle: '2.7'
            artifact: createtnt-1.8.9-forge
          - module: mods/createtnt/1.12.2-forge
            java: '8'
            gradle: '4.9'
            artifact: createtnt-1.12.2-forge
          - module: mods/createtnt/1.20.1-forge
            java: '17'
            gradle: '8.14.3'
            artifact: createtnt-1.20.1-forge
          - module: mods/createtnt/1.20.1-fabric
            java: '21'
            gradle: '9.5.0'
            artifact: createtnt-1.20.1-fabric
          - module: mods/createtnt/1.21.1-fabric
            java: '21'
            gradle: '9.5.0'
            artifact: createtnt-1.21.1-fabric
          - module: mods/createtnt/1.21.1-neoforge
            java: '21'
            gradle: '8.14.3'
            artifact: createtnt-1.21.1-neoforge
          - module: mods/createtnt/1.21.11-fabric
            java: '21'
            gradle: '9.5.0'
            artifact: createtnt-1.21.11-fabric
          - module: mods/createtnt/26.1.2-fabric
            java: '25'
            gradle: '9.5.0'
            artifact: createtnt-26.1.2-fabric

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle ${{ matrix.gradle }}
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ matrix.gradle }}
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build and run checks
        working-directory: ${{ matrix.module }}
        run: gradle build --no-daemon --stacktrace

      - name: Verify 1.8.9 smoke texture entries
        if: matrix.module == 'mods/createtnt/1.8.9-forge'
        working-directory: ${{ matrix.module }}
        run: |
          for frame in $(seq 0 9); do
            entry="assets/createtnt/textures/particle/explosion_smoke${frame}.png"
            jar tf build/libs/createtnt-1.8.9-forge-*.jar | grep -Fqx "$entry"
          done

      - name: Upload complete JAR outputs
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.module }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
